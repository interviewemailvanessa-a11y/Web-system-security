services:
  nginx:
  image: nginx:latest
  container_name: hardened-nginx
  ports:
    - "80:80"
    - "443:443"

  volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    - ./nginx/ssl:/etc/nginx/ssl:ro
    - ./nginx/html:/usr/share/nginx/html:ro
  
  read_only: true

  cap_drop:
    - ALL
  
  cap_add:
    - NET_BIND_SERVICE

  security_opt:
    - no-new-privileges:true

  restart: unless-stopped


